spring:
	profiles:
	  active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/shelfguard
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
