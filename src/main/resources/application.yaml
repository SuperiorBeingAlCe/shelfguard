spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/shelfguard
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

server:
  port: 8080

  risk:
    critical-days: 3
    high-days: 7
    medium-days: 21
  
springdoc:
  swagger-ui:
    path: /swagger-ui.html
